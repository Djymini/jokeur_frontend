<div class="card">
  <div class="card-header">
    <div class="title-group">
      <span class="icon">💉</span>
      <h2>Vaccins</h2>
    </div>
    <button class="btn-add" type="button" (click)="openDialogAdd()">+ Ajouter un vaccin</button>
  </div>

  <div class="vaccine-list">
    @if (vaccineArray().length > 0) {
      @for (vaccine of vaccineArray(); track $index) {
        <app-vaccine-item [vaccine]="vaccine"></app-vaccine-item>
      }
    } @else {
      <p>Aucun Vaccin</p>
    }
  </div>

  <div class="card-footer">
    <a href="#" class="link-more">Voir plus</a>
  </div>
</div>
