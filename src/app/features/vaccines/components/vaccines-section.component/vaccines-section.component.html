<section class="card vaccines-section">
  <div class="card-header">
    <div class="title-group">
      <span class="material-icons">vaccines</span>
      <h2>Vaccins</h2>
    </div>
    <z-button type="button" class="add-vaccine-btn" (click)="openDialogAdd()">
      <span class="material-icons">add</span>
      <span class="btn-text">Ajouter un vaccin</span>
    </z-button>
  </div>

  <div class="vaccine-list">
    @if (vaccineArray().length > 0) {
      @for (vaccine of vaccineArray(); track $index) {
        <app-vaccine-item [vaccine]="vaccine"></app-vaccine-item>
      }
    } @else {
      <p class="empty-message">Aucun Vaccin</p>
    }
  </div>

  <div class="card-footer"></div>
</section>
