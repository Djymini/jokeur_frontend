<h1 class="title">Se connecter</h1>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <div class="field">
    <label for="email">Email :</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      placeholder="Votre email"
      [attr.aria-invalid]="
        loginForm.controls.email.invalid &&
        (loginForm.controls.email.touched || loginForm.controls.email.dirty)
          ? true
          : null
      "
      aria-describedby="email-error"
    />

    @if (loginForm.controls.email.invalid && loginForm.controls.email.touched) {
      <p class="error" id="email-error">Email invalide</p>
    }
  </div>

  <div class="field password-field">
    <div class="div_label">
      <label for="password">Mot de passe :</label>
      <span class="material-icons">password</span>
    </div>

    <div class="input-wrapper">
      <input
        id="password"
        [type]="showPassword ? 'text' : 'password'"
        formControlName="password"
        placeholder="********"
      />
      <button
        type="button"
        class="eye"
        (click)="togglePassword()"
        [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      >
        <span class="material-icons">
          {{ showPassword ? 'visibility_off' : 'visibility' }}
        </span>
      </button>
    </div>
  </div>

  <button type="submit" [disabled]="loginForm.invalid">Connexion</button>
</form>

<p class="forgot">
  <a routerLink="/forgot-password">Mot de passe oublié ?</a>
</p>

<p class="bottom">
  Vous n’avez pas de compte ?
  <a routerLink="/register">Inscrivez-vous</a>
</p>
