<div class="board">
  <div class="board-header">
    <h3 class="board-title">
      {{ title() }}
    </h3>
    <button type="button" z-button>
      <i z-icon zType="plus"></i>
      Ajouter une saisie
    </button>
  </div>

  <div class="board-content">
    @for (measure of measures().slice(0, 5); track measure.id) {
      <app-measure-resume-item
        [value]="measure.value.toString()"
        [date]="measure.creationDate"
      ></app-measure-resume-item>
    }
  </div>
</div>
