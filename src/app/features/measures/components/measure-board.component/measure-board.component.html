<div class="board">
  <div class="board-header">
    <h3 class="board-title">
      <z-icon [zType]="icon()" zSize="xl" />
      {{ title() }}
    </h3>
  </div>

  <app-measure-chart [title]="title()" [mesures]="measures()"></app-measure-chart>

  <div class="board-footer">
    <button type="button" z-button zSize="sm" zType="link" (click)="openDialog()">Voir plus</button>
  </div>
</div>
