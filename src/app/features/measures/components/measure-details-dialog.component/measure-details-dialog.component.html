<div class="w-full p-[16px] measure-details-dialog">
  <div class="overflow-hidden rounded-md border table-container">
    <table z-table class="measures-table">
      <thead z-table-header>
        <tr z-table-row>
          <th z-table-head class="date-column">Date</th>
          <th z-table-head class="value-column">Valeur</th>
          <th z-table-head class="w-16 actions-column">Actions</th>
        </tr>
      </thead>
      <tbody z-table-body>
        @for (measure of data.measuresSignal(); track measure.id) {
          <tr z-table-row class="measure-row">
            <td z-table-cell class="date-cell">
              <div class="lowercase date-text">{{ measure.creationDate }}</div>
            </td>
            <td z-table-cell class="value-cell">
              <div class="lowercase value-text">{{ measure.value | measure: data.type }}</div>
            </td>
            <td z-table-cell class="actions-cell">
              <div class="flex items-center gap-2 action-buttons">
                <z-button
                  zType="ghost"
                  class="action-btn edit-btn"
                  (click)="openDialogModify(measure)"
                  title="Modifier la valeur"
                >
                  <z-icon zType="book-open-text" />
                </z-button>
                <z-button
                  zType="ghost"
                  class="action-btn delete-btn"
                  (click)="openDialogDelete(measure)"
                  title="Supprimer la valeur"
                >
                  <z-icon zType="trash" />
                </z-button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr z-table-row>
            <td z-table-cell [attr.colspan]="4" class="h-24 text-center empty-state">
              No results.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
