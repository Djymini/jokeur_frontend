<div class="w-full p-[16px]">
  <div class="overflow-hidden rounded-md border">
    <table z-table>
      <thead z-table-header>
        <tr z-table-row>
          <th z-table-head>Date</th>
          <th z-table-head>Valeur</th>
          <th z-table-head class="w-16">Actions</th>
        </tr>
      </thead>
      <tbody z-table-body>
        @for (measure of measures; track measure.id) {
          <tr z-table-row>
            <td z-table-cell>
              <div class="lowercase">{{ measure.date }}</div>
            </td>
            <td z-table-cell>
              <div class="lowercase">{{ measure.value }}</div>
            </td>
            <td z-table-cell>
              <div class="flex items-center gap-2">
                <z-button
                  zType="ghost"
                  (click)="editMeasure(measure.id)"
                  title="Modifier la valeur"
                >
                  <z-icon zType="book-open-text" />
                </z-button>
                <z-button
                  zType="ghost"
                  (click)="deleteMeasure(measure.id)"
                  title="Supprimer la valeur"
                >
                  <z-icon zType="trash" />
                </z-button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr z-table-row>
            <td z-table-cell [attr.colspan]="4" class="h-24 text-center">No results.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
