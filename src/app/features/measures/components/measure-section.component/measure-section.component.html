<section class="measure-section">
  @if (measures().length > 0) {
    <app-measure-board
      [idHealthRecord]="1"
      [title]="boardName()"
      [icon]="boardIcon()"
      [type]="type()"
      [measures]="measures()"
    ></app-measure-board>
  }
  <app-measure-resume
    [title]="resumeTitle()"
    [measures]="measures()"
    [type]="type()"
  ></app-measure-resume>
</section>
