<form [formGroup]="appointmentForm" class="flex flex-col gap-4 p-2">
  <h2 class="text-lg font-bold">Modifier le rendez-vous</h2>

  <div class="grid gap-4">
    <div class="grid gap-2">
      <label for="reason" class="text-sm font-medium">Motif du rendez-vous</label>
      <input
        z-input
        id="reason"
        formControlName="reason"
        placeholder="ex: Consultation, Vaccin..."
      />
      @if (appointmentForm.get('reason')?.invalid && appointmentForm.get('reason')?.touched) {
        <span class="text-red-500 text-xs">Le motif est obligatoire</span>
      }
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="grid gap-2">
        <label for="dateTime" class="text-sm font-medium">Date et heure</label>
        <input z-input id="dateTime" type="datetime-local" formControlName="dateTime" />
      </div>

      <div class="grid gap-2">
        <label for="duration" class="text-sm font-medium">Durée (minutes)</label>
        <input z-input id="duration" type="number" formControlName="duration" />
      </div>
    </div>
  </div>

  <div class="mt-2 p-3 bg-blue-50 rounded-md border border-blue-100">
    <p class="text-xs text-blue-700">
      ID du rendez-vous : <span class="font-mono font-bold">#{{ data.appointment.id }}</span>
    </p>
  </div>
</form>
