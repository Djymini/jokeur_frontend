<div class="calendar-container">
  <div class="toolbar">
    <div class="btn-group">
      <z-button
        type="button"
        class="btn"
        mwlCalendarPreviousView
        [view]="view()"
        [(viewDate)]="viewDate"
      >
        <span class="material-icons">arrow_left</span>
        Précédent
      </z-button>
      <z-button type="button" class="btn btn-outline" mwlCalendarToday [(viewDate)]="viewDate"
        >Aujourd'hui</z-button
      >
      <z-button
        type="button"
        class="btn"
        mwlCalendarNextView
        [view]="view()"
        [(viewDate)]="viewDate"
      >
        Suivant
        <span class="material-icons">arrow_right</span>
      </z-button>
    </div>

    <h2>{{ viewDate | calendarDate: view() + 'ViewTitle' : 'en' }}</h2>

    <div class="btn-group">
      <z-button
        type="button"
        class="btn"
        (click)="setView(CalendarView.Month)"
        [class.active]="view() === CalendarView.Month"
        >Mois</z-button
      >
      <z-button
        type="button"
        class="btn"
        (click)="setView(CalendarView.Week)"
        [class.active]="view() === CalendarView.Week"
        >Semaine</z-button
      >
      <z-button
        type="button"
        class="btn"
        (click)="setView(CalendarView.Day)"
        [class.active]="view() === CalendarView.Day"
        >Jour</z-button
      >
    </div>
  </div>

  @switch (view()) {
    @case (CalendarView.Month) {
      <mwl-calendar-month-view [viewDate]="viewDate" [events]="events()"> </mwl-calendar-month-view>
    }
    @case (CalendarView.Week) {
      <mwl-calendar-week-view [viewDate]="viewDate" [events]="events()"> </mwl-calendar-week-view>
    }
    @case (CalendarView.Day) {
      <mwl-calendar-day-view [viewDate]="viewDate" [events]="events()"> </mwl-calendar-day-view>
    }
  }

  <z-button type="button" class="btn btn-primary add-btn">
    <span class="material-icons">add</span>
    Ajouter un événement
  </z-button>
</div>
