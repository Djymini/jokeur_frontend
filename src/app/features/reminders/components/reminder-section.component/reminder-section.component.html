<section>
  <div class="section-header">
    <h2>Rappels</h2>
    <z-button type="button">
      <span class="material-icons">add</span>
      Ajouter un rappel
    </z-button>
  </div>

  <div class="section-body">
    @for (reminder of reminderPage().content; track $index) {
      <app-date-card [reminder]="reminder" [hasDescription]="false"></app-date-card>
    }
  </div>
</section>
