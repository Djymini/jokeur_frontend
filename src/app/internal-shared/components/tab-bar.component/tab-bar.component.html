<div class="tab-container">
  @for (tabLink of tabLinks(); track $index) {
    <button
      class="tablinks tab-button"
      [class.active]="activeTabLink() === tabLink.name"
      (click)="selectTab(tabLink.name)"
      type="button"
    >
      <span class="material-icons cursor-pointer">{{ tabLink.icon }}</span>
      <span class="tab-label">{{ tabLink.name }}</span>
    </button>
  }
</div>
